name: ASTRA Windows Gate 2026-10-06

on:
  pull_request:
    paths:
      - '.github/workflows/astra-windows-gate.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'aavc.spec'

permissions:
  contents: read

jobs:
  astra-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
          cache: 'pip'

      - name: Install pinned project dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip check

      - name: Install FFmpeg Full for integration evidence
        shell: pwsh
        run: |
          choco install ffmpeg-full --version=9.0.2 -y --no-progress
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          Write-Host "FFMPEG=$ffmpeg"
          & $ffmpeg -hide_banner -h filter=ass

      - name: Run targeted real FFmpeg integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/integration/test_step10_ffmpeg_render.py -q

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify portable smoke
        shell: pwsh
        run: ./scripts/verify_portable.ps1

      - name: Prepare gate evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/astra-windows-gate | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          $ffmpegVersion = (& ffmpeg -version | Select-Object -First 1)
          @(
            "ASTRA_WINDOWS_GATE=PASS"
            "SOURCE_SHA=$sha"
            "FFMPEG=$ffmpegVersion"
            "RUNNER_OS=$env:RUNNER_OS"
            "RUNNER_ARCH=$env:RUNNER_ARCH"
          ) | Set-Content artifacts/astra-windows-gate/BUILD_INFO.txt -Encoding utf8

          $zip = "artifacts/astra-windows-gate/AAVC-ASTRA-WINDOWS-GATE-$sha.zip"
          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content artifacts/astra-windows-gate/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem artifacts/astra-windows-gate | Select-Object Name, Length

      - name: Upload Windows gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AAVC-ASTRA-Windows-Gate
          path: artifacts/astra-windows-gate/*
          if-no-files-found: error
          retention-days: 30
