name: Package Windows Foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.15'
          cache: 'pip'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Build onedir
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Archive portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath "AAVC-foundation-win64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: AAVC-foundation-win64
          path: AAVC-foundation-win64.zip
          if-no-files-found: error
