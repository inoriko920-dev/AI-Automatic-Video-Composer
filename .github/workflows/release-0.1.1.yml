name: Maintenance Release Windows 0.1.1

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Attempt to publish the verified 0.1.1 bundle as a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  final-release:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release_commit: ${{ steps.release_source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: release/0.1.1
      - name: Resolve frozen release source
        id: release_source
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release source commit: $commit"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (python -c "from aavc import __version__; print(__version__)").Trim()
          if ($version -ne "0.1.1") { throw "Expected package version 0.1.1, got $version" }
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/aavc
      - name: Cheap tests
        run: python -m pytest -m "not integration and not visual and not e2e" -q
      - name: Capture STEP09 actual UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_step09_ui.py --output artifacts/step09-ui
      - name: Verify STEP09 screenshots
        shell: pwsh
        run: |
          $count = (Get-ChildItem artifacts/step09-ui -Filter "*_ACTUAL.png" -File).Count
          if ($count -lt 8) { throw "Expected at least 8 STEP09 screenshots, got $count" }
      - name: Build Windows onedir
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Prepare 0.1.1 release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = "release/AI-Automatic-Video-Composer-0.1.1-win64.zip"
          $source = "release/AI-Automatic-Video-Composer-0.1.1-source.zip"
          if (Test-Path $portable) { Remove-Item $portable -Force }
          if (Test-Path $source) { Remove-Item $source -Force }
          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $portable -CompressionLevel Optimal
          git archive --format=zip --output=$source HEAD
          Copy-Item RELEASE_NOTES_0.1.1.md release/RELEASE_NOTES_0.1.1.md
          Copy-Item MAINTENANCE.md release/MAINTENANCE.md
          Copy-Item BACKUP_AND_RECOVERY.md release/BACKUP_AND_RECOVERY.md
          $commit = (git rev-parse HEAD).Trim()
          "release_commit=$commit" | Set-Content release/BUILD_INFO.txt -Encoding utf8
          "version=0.1.1" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          $files = @($portable, $source)
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $sumLines | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: Upload verified 0.1.1 bundle
        uses: actions/upload-artifact@v7
        with:
          name: AAVC-0.1.1-final-win64
          path: release/*
          if-no-files-found: error
          retention-days: 90

  publish-github-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_github_release }}
    needs: final-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified 0.1.1 bundle
        uses: actions/download-artifact@v8
        with:
          name: AAVC-0.1.1-final-win64
          path: release
      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Git tag $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
      - name: Publish GitHub Release 0.1.1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.1
          RELEASE_COMMIT: ${{ needs.final-release.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "AI Automatic Video Composer 0.1.1" \
            --notes-file release/RELEASE_NOTES_0.1.1.md
