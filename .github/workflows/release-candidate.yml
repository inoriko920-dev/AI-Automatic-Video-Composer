name: Historical Verification — RC 0.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/step14-rc1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/aavc
      - name: Cheap tests
        run: python -m pytest -m "not integration and not visual and not e2e" -q
      - name: Build Windows onedir
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Prepare historical RC verification archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $zip = "release/AI-Automatic-Video-Composer-0.1.0-rc1-win64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item RELEASE_NOTES_RC1.md release/RELEASE_NOTES_RC1.md
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AI-Automatic-Video-Composer-0.1.0-rc1-win64.zip" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem release | Select-Object Name, Length
      - name: Upload historical RC verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: AAVC-0.1.0-rc1-historical-verification
          path: release/*
          if-no-files-found: error
          retention-days: 30
