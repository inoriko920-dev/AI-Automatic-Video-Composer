name: Final Release Windows

on:
  push:
    branches:
      - bootstrap/step15
      - publish/v0.1.0
    paths-ignore:
      - STEP15_STATUS.md
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Publish the verified bundle as a GitHub Release after all gates pass
        required: false
        default: false
        type: boolean
      release_tag:
        description: Git tag to create for the published release
        required: false
        default: v0.1.0
        type: string
      release_source_ref:
        description: Frozen source ref to build and tag for the official 0.1.0 release
        required: false
        default: release/0.1.0
        type: string

permissions:
  contents: read

jobs:
  final-release:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release_commit: ${{ steps.release_source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_ref || (github.event_name == 'push' && github.ref == 'refs/heads/publish/v0.1.0') && 'release/0.1.0' || github.sha }}
      - name: Validate official release inputs
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) || (github.event_name == 'push' && github.ref == 'refs/heads/publish/v0.1.0') }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v0.1.0' }}
          RELEASE_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_source_ref || 'release/0.1.0' }}
        run: |
          if ($env:RELEASE_TAG -ne "v0.1.0") {
            throw "This workflow is sealed for v0.1.0; got release_tag=$env:RELEASE_TAG"
          }
          if ($env:RELEASE_SOURCE_REF -ne "release/0.1.0") {
            throw "Official v0.1.0 must be built from release/0.1.0; got release_source_ref=$env:RELEASE_SOURCE_REF"
          }
      - name: Resolve release source commit
        id: release_source
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release source commit: $commit"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/aavc
      - name: Cheap tests
        run: python -m pytest -m "not integration and not visual and not e2e" -q
      - name: Capture STEP09 actual UI
        shell: pwsh
        run: python scripts/capture_step09_ui.py --output artifacts/step09-ui
      - name: Verify STEP09 screenshots
        shell: pwsh
        run: |
          $count = (Get-ChildItem artifacts/step09-ui -Filter "*_ACTUAL.png" -File).Count
          if ($count -lt 8) { throw "Expected at least 8 STEP09 screenshots, got $count" }
      - name: Build Windows onedir
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Prepare final release and backup set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = "release/AI-Automatic-Video-Composer-0.1.0-win64.zip"
          $source = "release/AI-Automatic-Video-Composer-0.1.0-source.zip"
          if (Test-Path $portable) { Remove-Item $portable -Force }
          if (Test-Path $source) { Remove-Item $source -Force }
          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $portable -CompressionLevel Optimal
          git archive --format=zip --output=$source HEAD
          Copy-Item RELEASE_NOTES_0.1.0.md release/RELEASE_NOTES_0.1.0.md
          Copy-Item MAINTENANCE.md release/MAINTENANCE.md
          Copy-Item BACKUP_AND_RECOVERY.md release/BACKUP_AND_RECOVERY.md
          $commit = (git rev-parse HEAD).Trim()
          "release_commit=$commit" | Set-Content release/BUILD_INFO.txt -Encoding utf8
          "version=0.1.0" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          $files = @($portable, $source)
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $sumLines | Set-Content release/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem release | Select-Object Name, Length
      - name: Upload final release bundle
        uses: actions/upload-artifact@v7
        with:
          name: AAVC-0.1.0-final-win64
          path: release/*
          if-no-files-found: error
          retention-days: 90

  publish-github-release:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) || (github.event_name == 'push' && github.ref == 'refs/heads/publish/v0.1.0') }}
    needs: final-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified final bundle
        uses: actions/download-artifact@v8
        with:
          name: AAVC-0.1.0-final-win64
          path: release
      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v0.1.0' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Git tag $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v0.1.0' }}
          RELEASE_COMMIT: ${{ needs.final-release.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "AI Automatic Video Composer 0.1.0" \
            --notes-file release/RELEASE_NOTES_0.1.0.md
