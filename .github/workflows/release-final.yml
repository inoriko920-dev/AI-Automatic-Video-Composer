name: Final Release Windows

on:
  push:
    branches:
      - bootstrap/step15
    paths-ignore:
      - STEP15_STATUS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/aavc
      - name: Cheap tests
        run: python -m pytest -m "not integration and not visual and not e2e" -q
      - name: Capture STEP09 actual UI
        shell: pwsh
        run: python scripts/capture_step09_ui.py --output artifacts/step09-ui
      - name: Verify STEP09 screenshots
        shell: pwsh
        run: |
          $count = (Get-ChildItem artifacts/step09-ui -Filter "*_ACTUAL.png" -File).Count
          if ($count -lt 8) { throw "Expected at least 8 STEP09 screenshots, got $count" }
      - name: Build Windows onedir
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify portable artifact
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Prepare final release and backup set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = "release/AI-Automatic-Video-Composer-0.1.0-win64.zip"
          $source = "release/AI-Automatic-Video-Composer-0.1.0-source.zip"
          if (Test-Path $portable) { Remove-Item $portable -Force }
          if (Test-Path $source) { Remove-Item $source -Force }
          Compress-Archive -Path "dist/AI Automatic Video Composer/*" -DestinationPath $portable -CompressionLevel Optimal
          git archive --format=zip --output=$source HEAD
          Copy-Item RELEASE_NOTES_0.1.0.md release/RELEASE_NOTES_0.1.0.md
          Copy-Item MAINTENANCE.md release/MAINTENANCE.md
          Copy-Item BACKUP_AND_RECOVERY.md release/BACKUP_AND_RECOVERY.md
          $commit = (git rev-parse HEAD).Trim()
          "release_commit=$commit" | Set-Content release/BUILD_INFO.txt -Encoding utf8
          "version=0.1.0" | Add-Content release/BUILD_INFO.txt -Encoding utf8
          $files = @($portable, $source)
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $sumLines | Set-Content release/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem release | Select-Object Name, Length
      - name: Upload final release bundle
        uses: actions/upload-artifact@v7
        with:
          name: AAVC-0.1.0-final-win64
          path: release/*
          if-no-files-found: error
          retention-days: 90
